# Scheduled jobs for the league.
#
# GitHub Actions rather than Vercel Cron: the Vercel Hobby plan allows
# only two cron jobs and only daily schedules, which cannot cover
# in-game score updates or hourly waiver processing. Actions is free for
# public repos and takes any cron expression.
#
# Repository secrets required (Settings > Secrets and variables > Actions):
#   APP_URL      the deployed site, e.g. https://chaos-league.vercel.app
#   CRON_SECRET  the same value set in the Vercel environment variables
#
# All times are UTC. US Eastern is UTC-4 during the NFL season.

name: Scheduled jobs

on:
  schedule:
    # Player list, schedule, ADP and this season's projections: every
    # morning, 05:00 ET. ADP moves daily through August and not at all
    # once drafts are done, and a season projection moves with it, so
    # both ride along with the player sync rather than getting a slot.
    - cron: "0 9 * * *"
    # Stats: through the night after each slate, so corrections land.
    # Mon/Tue/Wed/Fri 04:00, 10:00 and 16:00 UTC. Finalizing matchups
    # rides along, straight after the stats: it only closes a week once
    # every game is final with official stats and the last kickoff is 36
    # hours old, so after a Monday night game that is Wednesday's 16:00
    # run at the earliest.
    - cron: "0 4,10,16 * * 1,2,3,5"
    # Lineup locks: every 15 minutes on game days (Thu, Sun, Mon ET).
    - cron: "*/15 16-23,0-6 * * 0,1,4,5"
    # Live scoring: every 5 minutes through the game windows. Thu and
    # Mon night, and all day Sunday. A no-op when nothing is in progress.
    - cron: "*/5 17-23,0-6 * * 0,1,5"
    # Waivers: hourly. Each league is only processed in its own
    # configured hour, so this is a no-op most of the time.
    - cron: "0 * * * *"
    # Projections: Wed, Fri and Sunday morning. They move all week as
    # injuries are reported, and the Sunday number is the one people
    # actually set a lineup against.
    - cron: "0 13 * * 0,3,5"
    # Injuries: every three hours. The cheapest job here and the one
    # worth running most often -- a practice report lands hours before
    # kickoff and decides who starts.
    - cron: "0 */3 * * *"

  # Lets you run any single job by hand from the Actions tab.
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        required: true
        default: sync-stats
        type: choice
        options:
          - sync-players
          - sync-adp
          - sync-games
          - sync-stats
          - sync-projections
          - sync-season-projections
          - sync-injuries
          - live-scores
          - lock-lineups
          - process-waivers
          - finalize-weeks
      week:
        description: 'Week for sync-stats ("all" backfills the season)'
        required: false
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Work out which jobs this trigger should run
        id: plan
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL: ${{ inputs.job }}
        run: |
          if [ -n "$MANUAL" ]; then
            echo "jobs=$MANUAL" >> "$GITHUB_OUTPUT"
          else
            case "$SCHEDULE" in
              "0 9 * * *")            echo "jobs=sync-players sync-games sync-adp sync-season-projections" >> "$GITHUB_OUTPUT" ;;
              "0 4,10,16 * * 1,2,3,5") echo "jobs=sync-stats finalize-weeks" >> "$GITHUB_OUTPUT" ;;
              "*/15 16-23,0-6 * * 0,1,4,5") echo "jobs=lock-lineups" >> "$GITHUB_OUTPUT" ;;
              "*/5 17-23,0-6 * * 0,1,5") echo "jobs=live-scores" >> "$GITHUB_OUTPUT" ;;
              "0 * * * *")            echo "jobs=process-waivers" >> "$GITHUB_OUTPUT" ;;
              "0 13 * * 0,3,5")       echo "jobs=sync-projections" >> "$GITHUB_OUTPUT" ;;
              "0 */3 * * *")          echo "jobs=sync-injuries" >> "$GITHUB_OUTPUT" ;;
              *)                      echo "jobs=" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Call the endpoints
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          WEEK: ${{ inputs.week }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL and CRON_SECRET repository secrets must be set." >&2
            exit 1
          fi

          failed=0
          for job in ${{ steps.plan.outputs.jobs }}; do
            # Freezing results on top of a stat sync that just failed
            # would lock in stale scores. Leave it for the next run.
            if [ "$job" = "finalize-weeks" ] && [ "$failed" = 1 ]; then
              echo "--- $job skipped: an earlier job failed"
              continue
            fi

            url="$APP_URL/api/cron/$job"
            if { [ "$job" = "sync-stats" ] || [ "$job" = "sync-projections" ]; }                && [ -n "$WEEK" ]; then
              url="$url?week=$WEEK"
            fi

            echo "--- $job"
            # Anything but a 2xx fails the step, and the body is printed
            # either way so the reason is in the log. That includes 3xx:
            # curl's --fail ignores redirects, and a redirect to /login
            # once let every job "succeed" without running.
            status=$(curl --silent --show-error \
                          --max-time 600 \
                          --output response.txt \
                          --write-out "%{http_code}" \
                          --header "Authorization: Bearer $CRON_SECRET" \
                          "$url") || status=000
            cat response.txt 2>/dev/null || true
            echo
            case "$status" in
              2??) ;;
              *)   echo "$job failed: HTTP $status" >&2; failed=1 ;;
            esac
            rm -f response.txt
          done

          exit $failed
